# mengyu nginx 站点模板（放 /etc/nginx/conf.d/mengyu.conf 或 sites-enabled）。
# 关键点：
#   - SSE 三个流式接口必须 proxy_buffering off，否则 nginx 攒缓冲导致「延迟出字」；
#   - LLM 流式可能偏慢，read timeout 放宽到 300s；
#   - 静态资源 nginx 直发，绕过 Python（缓存头在此声明，与 HeadersMiddleware 等效）；
#   - 本机反代 → uvicorn --proxy-headers 会把 X-Forwarded-For 还原为真实客户端 IP
#     （登录限流按该 IP 计数）。
# HTTPS 证书（Let's Encrypt）与域名 ICP 备案请按实际环境补齐。

upstream mengyu_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name example.com;   # ← 换成实际域名
    # 生产建议 80 → 443 强制跳转 + TLS 证书（此处从略）

    client_max_body_size 1m;   # 表单/JSON 均很小，防大请求体

    # ----- SSE 流式接口：关缓冲、放宽超时 -----
    location ~ ^/(dream|journal|horoscope)/api/ {
        proxy_pass http://mengyu_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;           # SSE 必须
        proxy_cache off;
        proxy_read_timeout 300s;       # LLM 逐 token 输出可能较慢
        chunked_transfer_encoding off;
    }

    # ----- 静态资源：nginx 直发（root 指向 app/，URL /static/x → app/static/x）-----
    # 字体单独命中 immutable 一年缓存；正则 location 优先于前缀 location。
    location ~* ^/static/.*\.woff2$ {
        root /opt/mengyu/app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /static/ {
        root /opt/mengyu/app;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    # ----- 其余全部交给应用 -----
    location / {
        proxy_pass http://mengyu_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
