# 星座文案质量评分量表 —— 供 LLM-as-Judge 使用
# 两个维度：准确性（文案是否忠实于引擎数据）、可读性（文案是否自然流畅）
# 关键原则：所有标准基于「输出文本中可观察的行为」，每级含正反例

accuracy:
  name: "准确性"
  short: "accuracy"
  max_score: 5
  description: >
    评估运势文案是否忠实于引擎提供的固定数据（分数、幸运项、宜忌、速配）。引擎数据已在评分 prompt 中给出，
    请逐字段比对文案中的数值与引擎数据是否一致。
  levels:
    1:
      summary: "严重失实"
      criteria:
        - "自行更改了 ≥2 个引擎给定的固定数值（如将 health=64 写成'健康指数 72'，或将幸运色从'青草绿'改为'薄荷绿'）"
        - "或遗漏了 ≥2 个关键字段（如缺少 career/lucky/advice 中的整行）"
        - "正例：所有字段数值与引擎数据完全一致"
        - "反例：引擎给 wealth=45，文案写'财运指数 58 分'或'财运亨通'（捏造+美化）"
    2:
      summary: "存在出入"
      criteria:
        - "1 个固定字段的数值与引擎数据不一致，或遗漏了 1 个关键字段"
        - "或宜忌内容被改写（如引擎给'宜=散步放空'，文案写成'宜=出门走走'——措辞不同但语义接近也算改写）"
        - "反例：引擎给 match.best=天秤座，文案写成速配=金牛座"
    3:
      summary: "数值正确但表述有偏差"
      criteria:
        - "所有固定字段的数值与引擎数据完全一致"
        - "但至少 1 个维度的 text 描述与数值不匹配（如 wealth=45 却写成'财运不错''财务上有好消息'）"
        - "或 text 中加入了引擎数据未提供的信息（如自行添加'今天穿红色会更顺利'——引擎未提供此建议）"
    4:
      summary: "准确且匹配"
      criteria:
        - "所有固定字段与引擎输出完全一致，逐字段可验证"
        - "各维度 text 的定性描述与对应分数匹配（低分不美化、高分不浮夸、中分不平淡）"
        - "advice text 与宜忌内容呼应（如宜=联系老友，text 中自然提及'和老朋友聊聊'）"
    5:
      summary: "准确且深度融合"
      criteria:
        - "满足4分的全部要求"
        - "且 text 中自然融入了引擎提供的星象/黄历信息（如月相、行星所在星座、干支等），且引用正确"
        - "或宜忌与各维度 text 之间形成了有机的叙事关联（如 career text 呼应了忌'拖延重要事'）"

readability:
  name: "可读性"
  short: "readability"
  max_score: 5
  description: >
    评估运势文案是否自然流畅、有温度、有个性化表达，而非机械模板填空。
    不评估内容准确性（由 accuracy 维度单独评分）。
  levels:
    1:
      summary: "机械罗列"
      criteria:
        - "文案呈现明显的字段拼接感——直接罗列'今日综合指数82分，爱情指数65分，事业指数70分...'"
        - "或每段 text 以完全相同的句式开头（如全部用'今天你在xxx方面...'）"
        - "反例：'今日运势如下：综合82分，爱情65分，事业70分，财富55分，健康80分。幸运色薄荷绿...'（像 Excel 表格转文字）"
    2:
      summary: "模板痕迹明显"
      criteria:
        - "整体结构像套模板（如以'今日运势'开头、每段用'在感情方面''在事业方面''在财运方面'等过度标记过渡）"
        - "或各维度 text 的句式高度雷同（如全部为'今天你的xxx运势不错，建议yyy'，仅替换关键词）"
        - "反例：5 段 text 全部以'今天在xx方面'开头，读起来像 madlib 填空"
    3:
      summary: "通顺但平淡"
      criteria:
        - "语句自然通顺，无明显模板痕迹或句式雷同"
        - "但各维度之间的过渡较生硬（如直接从 love text 跳到 career text，缺少呼吸感）"
        - "或整体语气偏正式/书面，缺乏星座解读应有的轻盈感（如大量使用'建议您''请注意'等正式措辞）"
    4:
      summary: "流畅有温度"
      criteria:
        - "行文流畅有节奏，各维度之间过渡自然（如通过情绪线索或时间线串联）"
        - "有符合星座特质的个性化表达（如白羊座的直接、双鱼座的柔软、处女座的细致）"
        - "text 之间有呼吸感——长短句交替、节奏有变化"
    5:
      summary: "娓娓道来"
      criteria:
        - "满足4分的全部要求"
        - "且像朋友聊天般自然，完全避免了'运势''方面''建议'等套路化措辞"
        - "或巧妙使用了叙事技巧（如以一段小场景或一个问题开场，再自然过渡到各维度）"
        - "正例：'今天你的心里好像装着一团温暖的火——感情上尤其如此。工作那边倒是需要多几分耐心...'（对话感，无模板词）"
